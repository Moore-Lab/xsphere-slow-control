# =============================================================================
# Telegraf configuration for xsphere slow control system
#
# Role: subscribe to all xsphere/# MQTT topics and write to InfluxDB 2.x.
#       This replaces the Node-RED parse→influxdb-node pipeline.
#
# Deploy: add the telegraf service to IOTstack and mount this file at
#         /etc/telegraf/telegraf.conf inside the container. Pass the
#         variables from .env into the container environment.
#
# MQTT topic schema (published by slowcontrol Python service and ESP32s):
#
#   xsphere/sensors/temperature/{source}/{type}/{channel}
#     source : plc | omega
#     type   : rtd | tc
#     channel: 1-4
#     payload: {"value_k": <float>, "value_c": <float>}
#
#   xsphere/sensors/pressure/{source}/{gauge}/{channel}
#     source : ghs
#     gauge  : setra | penningvac
#     channel: 1-3 (setra), 1-2 (penningvac)
#     payload: {"value": <float>}   [unit: mbar]
#
#   xsphere/sensors/level/{vessel}
#     vessel : cryostat | primary_xe | ballast
#     payload: {"raw": <float>, "filtered": <float>}   [0-10 scale]
#              cryostat only, and only when the register read succeeds:
#                + "fill_status": 0|1   [ladder DS3 latch, 0 = empty]
#              NOTE the ballast/primary_xe ESP32s publish "raw_pf" on this
#              same topic, not "raw", so their messages do not currently
#              parse here at all.  Pre-existing, unrelated to fill_status.
#
#   xsphere/sensors/environment/ghs/{parameter}
#     parameter: humidity | temperature | baro_pressure
#     payload: {"value": <float>}
#
#   xsphere/status/pid/{zone}
#     zone: top | bottom | nozzle
#     payload: {"setpoint_k": <f>, "pv_k": <f>, "output_pct": <f>,
#               "kp": <f>, "ki": <f>, "kd": <f>}
#
#   xsphere/status/valve/{vessel}
#     vessel: cryostat | primary_xe | ballast
#     payload: {"state": 0|1, "desired": 0|1,
#               "auto_close": 0|1, "auto_open": 0|1}
#     vessel: gas_ballast | gas_pump | gas_bottle   (Y105-Y107 solenoids)
#     payload: {"state": 0|1, "desired": 0|1}
#
#   xsphere/status/service/heartbeat
#     payload: {"uptime_s": <int>}
#
# Commands (xsphere/commands/#) are NOT stored — Telegraf ignores them.
# =============================================================================

[global_tags]
  system = "xsphere"

[agent]
  interval          = "5s"
  round_interval    = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval    = "5s"
  precision         = "1s"
  hostname          = ""
  omit_hostname     = true

# ---------------------------------------------------------------------------
# Output: InfluxDB v2
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls         = ["${INFLUX_URL}"]
  token        = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket       = "${INFLUX_BUCKET}"

# ---------------------------------------------------------------------------
# Input 1: Temperature sensors
# Topics : xsphere/sensors/temperature/{source}/{type}/{channel}
# Measurement: temperature
# Tags   : source, sensor_type, channel
# Fields : value_k (Kelvin), value_c (Celsius)
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/sensors/temperature/+/+/+"]
  qos      = 1
  retained = false

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/sensors/temperature/+/+/+"
    measurement = "temperature"
    tags        = "_/_/_/source/sensor_type/channel"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value_k"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value_c"
      type = "float"

# ---------------------------------------------------------------------------
# Input 2: Pressure sensors (Setra 225 manometers)
# Topics : xsphere/sensors/pressure/{source}/{gauge}/{channel}
# Measurement: pressure
# Tags   : source, gauge, channel
# Fields : value (mbar)
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/sensors/pressure/+/+/+"]
  qos      = 1
  retained = false

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/sensors/pressure/+/+/+"
    measurement = "pressure"
    tags        = "_/_/_/source/gauge/channel"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"

# ---------------------------------------------------------------------------
# Input 3: Vacuum gauges (PenningVAC full-range)
# Topics : xsphere/sensors/vacuum/{source}/{channel}
# Measurement: vacuum
# Tags   : source, channel
# Fields : value (mbar)
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/sensors/vacuum/+/+"]
  qos      = 1
  retained = false

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/sensors/vacuum/+/+"
    measurement = "vacuum"
    tags        = "_/_/_/source/channel"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"

# ---------------------------------------------------------------------------
# Input 4: Liquid level sensors
# Topics : xsphere/sensors/level/{vessel}
# Measurement: level
# Tags   : vessel
# Fields : raw (0-10), filtered (0-10), fill_status (0|1, cryostat only)
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/sensors/level/+"]
  qos      = 1
  retained = false

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/sensors/level/+"
    measurement = "level"
    tags        = "_/_/_/vessel"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "raw"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "filtered"
      type = "float"
    # Cryostat fill-status latch, DS3, straight off the CLICK ladder:
    # 0 = empty (rung 26, DF303 < 0.8), 1 = full (rung 27, DF303 > 2.5),
    # holding its previous value in between.  Graph it as a step alongside
    # `filtered` to see what the valve logic actually decided, which is not
    # always what a threshold line drawn across the level would suggest.
    #
    # `optional` is required here, not defensive.  Two different publishers
    # share this topic: the PLC driver (cryostat) sends this field, the ESP32
    # level sensors (ballast, primary_xe) do not, and the PLC driver itself
    # omits it rather than guessing when the DS3 read fails.  Without the
    # flag a missing path fails the whole message, which would take cryostat
    # level ingestion down with it.
    #
    # `optional` on json_v2 fields arrived in a Telegraf 1.2x release (1.24
    # or thereabouts — check `telegraf --version` against the changelog if
    # this matters).  A Telegraf too old to know the key rejects it at
    # startup, and then NO input loads at all, so the symptom is total
    # telemetry loss rather than a missing field.  If that happens, delete
    # this four-line field block rather than dropping just the flag: without
    # `optional` the field would break the ESP32 messages instead.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fill_status"
      type = "int"
      optional = true

# ---------------------------------------------------------------------------
# Input 4b: Level values as filtered by the autovalve controller
# Topics : xsphere/status/level/{vessel}
# Measurement: level_filtered
# Tags   : vessel
# Fields : raw, filtered
#
# A separate topic from xsphere/sensors/level/{vessel} on purpose: the
# controller subscribes to that one, so republishing its own filter output
# there fed the filter its own output on every pass.
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/status/level/+"]
  qos      = 1
  retained = false

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/status/level/+"
    measurement = "level_filtered"
    tags        = "_/_/_/vessel"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "raw"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "filtered"
      type = "float"

# ---------------------------------------------------------------------------
# Input 5: Environmental sensors (GHS panel: humidity, temperature, baro)
# Topics : xsphere/sensors/environment/ghs/{parameter}
# Measurement: environment
# Tags   : location, parameter
# Fields : value
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/sensors/environment/+/+"]
  qos      = 1
  retained = false

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/sensors/environment/+/+"
    measurement = "environment"
    tags        = "_/_/_/location/parameter"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"

# ---------------------------------------------------------------------------
# Input 6: PID controller status
# Topics : xsphere/status/pid/{zone}
# Measurement: pid_state
# Tags   : zone (top | bottom | nozzle)
# Fields : setpoint_k, pv_k, output_pct, kp, ki, kd
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/status/pid/+"]
  qos      = 1
  retained = true   # PID status is published as retained

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/status/pid/+"
    measurement = "pid_state"
    tags        = "_/_/_/zone"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "setpoint_k"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_k"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "output_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "kp"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ki"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "kd"
      type = "float"

# ---------------------------------------------------------------------------
# Input 7: Solenoid valve status
# Topics : xsphere/status/valve/{vessel}
# Measurement: valve_state
# Tags   : vessel (cryostat | primary_xe | ballast | bypass |
#                  gas_ballast | gas_pump | gas_bottle)
# Fields : state, desired, auto_close, auto_open  (all 0/1 integers;
#          the gas_* solenoids and bypass carry state and desired only)
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/status/valve/+"]
  qos      = 1
  retained = true

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/status/valve/+"
    measurement = "valve_state"
    tags        = "_/_/_/vessel"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "desired"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "auto_close"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "auto_open"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "coast_permit"
      type = "int"

# ---------------------------------------------------------------------------
# Input 7b: Coast refill state (cryostat LN2 coast gate)
# Topics : xsphere/status/coast/{vessel}
# Measurement: coast_state
# Tags   : vessel
# Fields : permit_open, level, delta_k, t_warm_k, t_cold_k, elapsed_s,
#          dwell_s, ceiling_max_k, ladder_permit
#
# The history is what turns delta_max_k from an estimate into a measurement:
# without it, a coast that stranded the vessel cannot be diagnosed after the
# fact.  `state` and `hold_reason` are deliberately not ingested — they are
# strings, and the numeric fields plus the retained MQTT document cover both
# the trend and the live answer.
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/status/coast/+"]
  qos      = 1
  retained = true

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "xsphere/status/coast/+"
    measurement = "coast_state"
    tags        = "_/_/_/vessel"

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "permit_open"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "level"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "delta_k"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "t_warm_k"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "t_cold_k"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "elapsed_s"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dwell_s"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ceiling_max_k"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ladder_permit"
      type = "int"

# ---------------------------------------------------------------------------
# Input 8: Service heartbeat
# Topics : xsphere/status/service/heartbeat
# Measurement: service_heartbeat
# Fields : uptime_s
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers  = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics   = ["xsphere/status/service/heartbeat"]
  qos      = 1
  retained = true

  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "service_heartbeat"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_s"
      type = "int"
