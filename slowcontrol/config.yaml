# xsphere slow control service configuration
# All values shown are defaults — uncomment and edit to override.

mqtt:
  host: 192.168.8.116    # xbox-pi IP
  port: 1883
  client_id: xsphere-slowcontrol
  keepalive: 60

# Direct InfluxDB writes are disabled by default — Telegraf handles ingestion.
influx:
  enabled: false
  url: http://192.168.8.116:8086
  token: ""
  org: xsphere
  bucket: xsphere

plc:
  host: 192.168.8.119    # CLICK PLC (Modbus TCP server, port 502)
  port: 502
  unit_id: 1
  poll_interval: 1.0     # seconds between Modbus reads
  timeout: 3.0
  # Safety interlocks on the LabJack → PLC PV mirror. See
  # PlcDriver._write_labjack_to_plc. These values are the *initial* limits
  # at first boot; the driver persists subsequent web-GUI changes to
  # slowcontrol/pv_interlock.json, which then takes precedence here.
  pv_stale_s: 10.0           # no LJ MQTT update for this many seconds ⇒ trip
  # Trip if any LJ RTD value falls outside [pv_min_k, pv_max_k]. Catches
  # runaway over-temp AND sensor faults that read absurd values (-100000 K).
  # Raise pv_max_k via the Control page's Interlock card when baking.
  pv_min_k: 77.0
  pv_max_k: 310.0
  # On trip: SP = sp_safe_surrogate_k and OUT = 0 on all three PIDs, every
  # poll; the LabJack mirrors DF210-212 get pv_safe_surrogate_k.  Setpoint
  # and PV writes (expressions, commands) wait until it clears.
  pv_safe_surrogate_k: 500.0 # written to the mirrors DF210-212 on trip
  sp_safe_surrogate_k: 3.0   # written to SP on trip (must be below any plausible PV)
  # The old third leg — 500 K into each PID's own PV — is off: releasing it
  # wound the integrators below 0 % and left heaters off with PV < SP for
  # many minutes (docs/pid-windup.md).  true brings it back.
  pv_interlock_writes_pv: false

  # Heater stuck off by integrator windup (docs/pid-windup.md).  A zone is
  # "stuck off" when its PID is in Auto (the PLC's own indication bit), its
  # output is at or below pid_stuck_off_output_pct, its Bias (integrator) is
  # below the output floor, and its PV is more than pid_stuck_off_delta_k
  # below SP — continuously for pid_stuck_off_s and at least two PID samples
  # + 5 s.  Never while the PV interlock is tripped or the loop is in Manual.
  # Published as stuck_off on xsphere/status/pid/<zone> and as the retained
  # alert xsphere/alerts/pid_stuck_off/<zone>.
  pid_stuck_off_delta_k: 1.0
  pid_stuck_off_output_pct: 0.5
  pid_stuck_off_s: 20.0
  # off | alert | toggle.  toggle = alert, then one Manual → Auto toggle via
  # DF175/177/179 — what an operator does by hand — which makes the PLC set
  # Bias = output (0 %).  The mode is verified back in Auto and re-requested
  # until it is, also after a crash or restart (slowcontrol/pid_rescue.json);
  # any operator mode command for the zone ends that.
  pid_stuck_off_remedy: toggle
  pid_rescue_holdoff_s: 600.0    # at most one toggle per zone per this many s
  # Clamp each PID's Bias into its output limits every poll while in Auto —
  # stops the windup before it can hold a heater off.  Leave false until the
  # acceptance test in docs/pid-windup.md shows the PLC accepts the write.
  pid_integrator_guard: false

# Omega logger is no longer in use.

# Omega RDXL6SD-USB temperature logger — Modbus RTU over USB-serial.
# Wire type (TC vs RTD) and unit (°C/°F) are read live from the meter's
# configuration registers, so the operator only sets the channel number
# and label here.  Disconnected channels publish {"fault": true} every
# poll — easy to spot in the snapshot.
omega:
  enabled: true
  # FTDI bridge inside the RDXL6SD; serial-by-id symlink survives reboots
  # and USB-port-swaps, unlike /dev/ttyUSB<N> which depends on enumeration
  # order. If the device's USB serial changes (replacement unit), update
  # this path — `ls -la /dev/serial/by-id/` will show the new id.
  port: /dev/serial/by-id/usb-Omega_RDXL6SD-USB_0102-02856-if00-port0
  # Per the RDXL6SD-USB Modbus manual (Sept 2025).
  baud_rate: 57600
  stop_bits: 2
  modbus_address: 1
  poll_interval_s: 5.0
  channels:
    - {ch: 1, label: "Omega Ch-1"}
    - {ch: 2, label: "Omega Ch-2"}
    - {ch: 3, label: "Omega Ch-3"}
    - {ch: 4, label: "Omega Ch-4"}
    - {ch: 5, label: "Omega Ch-5"}
    - {ch: 6, label: "Omega Ch-6"}

# R&S NGE103 — the DC supply behind the three heaters (NGE ch n → heater n;
# the PLC still PWMs each heater through its SSR).  USB-TMC into the Pi; the
# udev rule in slowcontrol/99-xsphere-nge.rules provides /dev/nge100.
# See slowcontrol/drivers/nge.py for what it does and why.
nge:
  enabled: true
  resource: /dev/nge100    # or "sim" for the built-in simulator
  serial: "101129"         # only ever drive this unit; "" accepts any NGE100
  poll_interval_s: 1.0
  # Hold: keep each channel on the output state / voltage / current limit set
  # from the Control page, and put it back if it drops out or the supply is
  # power-cycled.  This is only the initial value — the Control page toggle
  # persists, with the held state, in slowcontrol/nge_state.json.
  hold: true
  # Switch off the supply's own switch-off triggers that fire in normal heater
  # operation: over-power protection (ships enabled at the 33.6 W channel
  # limit; the heaters are 36 W) and the electronic fuse.  OVP stays armed at
  # its 32.5 V maximum.  An overload then just current-limits.
  disable_auto_off: true
  # What the Control page's "defaults" button sends.  Note the supply caps the
  # current limit at 33.6 W / V — 1.400 A at 24 V — whatever is asked for.
  default_voltage_v: 24.0
  default_current_a: 1.5

# Leybold TURBOVAC 90 i turbo pumps, over each pump's USB port: monitored, and
# with `allow_control` started and stopped from the Control page.  Start and
# stop are all the service can do to a pump — never its speed or a setting;
# see slowcontrol/drivers/turbovac.py for how that is enforced.
#
# Both pumps' USB ports look identical to the Pi, so a pump is recognised by
# its own serial number: the one on its nameplate, which is also what the pump
# answers when asked.  Which USB port it is on, and the order things were
# plugged in, do not matter.  The names (ghs, outer) are used in the MQTT
# topics, state.yaml, telegraf.conf and the Control page.
turbovac:
  enabled: true
  # true: the Control page's on / off buttons work (once "enable control" has
  # been pressed on the page — that gate comes up shut on every service
  # start).  The service then holds a pump on or off by repeating the command
  # with every telegram.  A pump on its TURBOLAB Core's RS 485 lead ignores
  # all of it: the Core outranks USB.  Unless keep_command is set, a pump
  # that hears nothing for 10 s goes back to its stand by itself, so OFF from
  # here is not a lock-out.
  # false (or absent): read-only; the command topics do not exist.
  allow_control: true
  # After a service restart or a USB glitch a pump is held on / off again only
  # if contact was lost for less than this (seconds); after longer it is left
  # with its stand — unless it is a keep_command pump that has kept the
  # command by itself.  The held state is kept in slowcontrol/turbovac_state.json.
  resume_max_s: 120
  poll_interval_s: 2.0
  pumps:
    ghs:
      label: "GHS turbo — gas handling system + science chamber"
      serial: "31003077799"      # TURBOVAC 90 i, cat. no. 810041V1000
      # Its TURBOLAB Core's lead is out (since 2026-10-14), so the service is
      # what starts and stops it — see keep_command below the outer pump.
      keep_command: true
    outer:
      label: "Outer vacuum turbo"
      serial: "31003045053"      # TURBOVAC 90 i, cat. no. 810041V1000
      # Its TURBOLAB Core's RS 485 lead is out (since 2026-10-12), so the
      # service is what starts and stops it.  keep_command: while it is held,
      # its watchdog (parameter 182) is set to 0, so it stays running — or
      # stopped — with the Pi or the service down.  Released, it gets its
      # 10 s back: with nothing on its X1 socket it then stops.
      keep_command: true
    # A pump's entry with serial: "" is "not pinned": it takes the one TURBOVAC
    # on USB that no entry here names.  That is how to bring up a replacement
    # pump — it shows up on the Control page with the serial number it
    # reports, which then goes in here.

# Cryostat LN level probe — the MPR121 sensor's ESP32, plugged into the Pi by
# USB.  It prints "median delta = <count> | pwm = <0-255>" every ~3.5 s; the
# service turns pwm back into the voltage its analog output would have given
# (pwm / pwm_max * v_ref), publishes it on xsphere/sensors/level_probe/cryostat
# and the PLC driver writes it to DF333 (age of the reading, in s, to DF254).
# The analog copy of the same level is the CLICK's own input: DF203 → DF303.
# See slowcontrol/drivers/levelprobe.py.
level_probe:
  enabled: true
  # No port is named.  The board's CH340 USB chip has no serial number, so on
  # the USB side nothing but the socket it is in tells it from the other CH340
  # board on the Pi (the gas handling cart's ESP32) — and cables get moved.
  # The service listens to each CH340 adapter and takes the one that prints
  # the probe's lines, so the probe can be in any socket.  (To force a port
  # anyway, put its /dev/... path here instead of "auto".)
  port: auto
  usb_id: "1a86:7523"      # which adapters to listen to: CH340
  baud_rate: 9600
  vessel: cryostat
  pwm_max: 255
  v_ref: 3.3
  stale_s: 15.0

autovalve:
  # LN2 autofill is owned by the PLC ladder (it reads the analog level
  # inputs and decides when/how to open/close XV1/XV2/XV3). The Python
  # AutovalveController is an *optional* software state machine that would
  # do that logic itself from MQTT level readings — we keep it DISABLED so
  # there is a single autofill authority. High-level control (arm/disarm
  # autofill, manually command a valve) is done by writing the PLC's DS
  # registers via the xsphere/commands/valve/{vessel}/{state,auto_open,
  # auto_close} topics (handled by the PLC driver), and valve state is
  # published on xsphere/status/valve/{vessel}. The thresholds below are
  # only used if `enabled` is set true; the real ones live in the PLC.
  enabled: false
  vessels:
    cryostat:
      level_high: 2.5
      level_low: 0.25
      fill_timeout_s: 920
    primary_xe:
      level_high: 2.5
      level_low: 0.5
      fill_timeout_s: 600
    ballast:
      level_high: 2.5
      level_low: 0.5
      fill_timeout_s: 600

# LabJack T7 — thermometry via the AIN extended features (the device does the
# PT100 conversion itself; type-K TCs are differential gradiometers, re-referenced
# in software to a nearby RTD).  Global RTD numbering: 1-3 on the LabJack, 4-6 on
# the PLC.  Topics: xsphere/sensors/temperature/labjack/{rtd|tc}/<channel>.
labjack:
  connection_type: ETHERNET
  device_identifier: "192.168.8.194"   # T7 serial 470037304 (DHCP)
  poll_interval_s: 1.0
  read_internal_temp: false            # the board temp is reported as each TC's cjc_k
  thermometry_channels:
    # RTDs — PT100, AINx_EF_INDEX=40, 4-wire, 200 µA current source
    - {name: rtd1, kind: rtd, ain: 0,  channel: 1, label: "nozzle"}
    - {name: rtd2, kind: rtd, ain: 2,  channel: 2, label: "bottom cube"}
    - {name: rtd3, kind: rtd, ain: 4,  channel: 3, label: "top cube"}
    # Type-K thermocouple gradiometers — AINx_EF_INDEX=22, re-referenced to an RTD.
    # delta_c (this end − reference) is the gradient; value_c is the absolute temp.
    - {name: tc1, kind: tc, ain: 6,  channel: 1, label: "cube left<->right",  reference: "rtd3"}       # top cube RTD
    - {name: tc2, kind: tc, ain: 8,  channel: 2, label: "LN vessel <-> base", reference: "plc/rtd/4"}  # base RTD
    - {name: tc3, kind: tc, ain: 10, channel: 3, label: "along nipple",       reference: "rtd1"}       # nozzle RTD
    - {name: tc4, kind: tc, ain: 12, channel: 4, label: "cube front<->back",  reference: "rtd3"}       # top cube RTD

heartbeat_interval: 10.0    # seconds between heartbeat MQTT publishes
# Layer 1 — MQTT self-watchdog: if the MQTT client hasn't successfully
# published in this many seconds (typically because paho is stuck queue-full
# after a network blip), the service exits non-zero so systemd restarts us
# with a fresh paho client. Set to 0 to disable.
watchdog_timeout_s: 60.0
# Layer 1.5 — per-driver poll-thread watchdog: a driver whose thread is alive
# but hasn't completed a poll() in this many seconds (typical cause: blocked
# Modbus call post-power-outage) is treated as stuck. Other threads' heart-
# beats keep the MQTT watchdog above satisfied, so this catches the half-
# dead state where the service looks alive but one driver isn't actually
# reading. Set to 0 to disable. See _heartbeat_loop in core/service.py.
driver_poll_watchdog_s: 60.0
log_level: INFO
