# journald drop-in for xbox-pi: keep the journal on disk.
#
# /etc/systemd/journald.conf on xbox-pi sets Storage=volatile, which keeps the
# journal in RAM (about 75 MB) and loses it on every reboot. The lines that
# matter most are the ones just before a reboot or a power cut, and the root
# filesystem is an NVMe drive with room to spare, so this overrides it.
#
# Install (restarting journald does not restart any other service):
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp xsphere-journald.conf /etc/systemd/journald.conf.d/xsphere.conf
#   sudo systemctl restart systemd-journald
#   sudo journalctl --flush

[Journal]
Storage=persistent
SystemMaxUse=1G
